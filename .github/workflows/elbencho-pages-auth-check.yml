name: pages auth check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: See whether the release token can list elbencho workflows
        env:
          GH_TOKEN: ${{ secrets.ELBENCHO_RELEASE_TOKEN }}
        run: |
          set +e
          gh api repos/breuner/elbencho/actions/workflows --jq .total_count
          echo "list_exit=$?"
          gh api --method POST repos/breuner/elbencho/actions/workflows/package-repository.yml/dispatches \
            -f ref=master -f inputs[source_run]=auth-check
          echo "dispatch_exit=$?"
