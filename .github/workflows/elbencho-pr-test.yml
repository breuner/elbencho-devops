name: elbencho pull request tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: elbencho git ref to test
        required: true
        default: master
        type: string
      pr:
        description: Pull request number, when started for a pull request
        required: false
        default: ""
        type: string
      sha:
        description: Commit that was current when the run was started
        required: false
        default: ""
        type: string

run-name: ${{ inputs.pr && format('PR {0} {1}', inputs.pr, inputs.sha) || inputs.ref }}

permissions:
  contents: read

concurrency:
  group: elbencho-pr-${{ inputs.pr != '' && inputs.pr || inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: without S3
            mode: without-s3
          - name: S3
            mode: s3
          - name: S3 CRT
            mode: s3-crt
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: breuner/elbencho-devops
          ref: main
          path: devops
          persist-credentials: false

      - name: Free disk space
        run: devops/scripts/free-runner-disk.sh

      - name: Check out elbencho
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: breuner/elbencho
          ref: ${{ inputs.ref }}
          path: elbencho
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libaio-dev libboost-filesystem-dev libboost-json-dev \
            libboost-program-options-dev libboost-thread-dev \
            libcurl4-openssl-dev libncurses-dev libnuma-dev libssl-dev zlib1g-dev
          devops/scripts/install-test-tools.sh

      - name: Build and test
        run: devops/scripts/pr-test.sh "${{ matrix.mode }}" elbencho

  result:
    name: record result
    needs: test
    if: always() && inputs.pr != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: breuner/elbencho-devops
          ref: main
          path: devops
          persist-credentials: false

      - name: Record the commit status
        env:
          ELBENCHO_STATUS_TOKEN: ${{ secrets.ELBENCHO_STATUS_TOKEN }}
          RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          case "$RESULT" in
            success) state=success; description="pull request tests passed" ;;
            cancelled) state=error; description="pull request tests cancelled" ;;
            *) state=failure; description="pull request tests failed" ;;
          esac
          devops/scripts/pr-status.sh "$state" "${{ inputs.sha }}" "$description" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
