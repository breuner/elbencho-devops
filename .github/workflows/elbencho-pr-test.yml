name: elbencho pull request tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: elbencho git ref to test
        required: true
        default: master
        type: string
      pr:
        description: Pull request number, when started for a pull request
        required: false
        default: ""
        type: string
      sha:
        description: Commit that was current when the run was started
        required: false
        default: ""
        type: string

run-name: ${{ inputs.pr && format('PR {0} {1}', inputs.pr, inputs.sha) || inputs.ref }}

permissions:
  contents: read

concurrency:
  group: elbencho-pr-${{ inputs.pr != '' && inputs.pr || inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: without S3
            mode: without-s3
          - name: S3
            mode: s3
          - name: S3 CRT
            mode: s3-crt
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breuner/elbencho-devops
          ref: main
          path: devops
          persist-credentials: false

      - name: Free disk space
        run: devops/scripts/free-runner-disk.sh

      - name: Check out elbencho
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breuner/elbencho
          ref: ${{ inputs.ref }}
          path: elbencho
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config \
            libaio-dev libboost-filesystem-dev libboost-json-dev \
            libboost-program-options-dev libboost-thread-dev \
            libcurl4-openssl-dev libncurses-dev libnuma-dev libssl-dev zlib1g-dev
          devops/scripts/install-test-tools.sh

      - name: Build and test
        run: devops/scripts/pr-test.sh "${{ matrix.mode }}" elbencho

  result:
    name: record result
    needs: test
    if: always() && inputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breuner/elbencho-devops
          ref: main
          path: devops
          persist-credentials: false

      - name: Record the commit status
        env:
          ELBENCHO_STATUS_TOKEN: ${{ secrets.ELBENCHO_STATUS_TOKEN }}
          RESULT: ${{ needs.test.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          case "$RESULT" in
            success)
              state=success
              description="pull request tests passed"
              ;;
            cancelled)
              state=error
              description="pull request tests cancelled"
              ;;
            *)
              state=failure
              description=$(devops/scripts/pr-failure-excerpt.sh || true)
              if [ -z "$description" ]; then
                description="pull request tests failed"
              fi
              ;;
          esac
          devops/scripts/pr-status.sh "$state" "${{ inputs.sha }}" "$description" "$run_url"
