name: elbencho draft release windows package

on:
  workflow_call:
    inputs:
      tag:
        description: Existing elbencho git tag
        required: true
        type: string
    secrets:
      ELBENCHO_RELEASE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Keep LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out workflow scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out elbencho
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: breuner/elbencho
          ref: ${{ inputs.tag }}
          path: elbencho

      - name: Restore LF in the elbencho checkout
        shell: bash
        working-directory: elbencho
        run: |
          git config core.autocrlf false
          git checkout --force HEAD -- .

      - name: Install Cygwin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Join-Path $env:RUNNER_TEMP "setup-x86_64.exe"
          Invoke-WebRequest -Uri "https://cygwin.com/setup-x86_64.exe" -OutFile $setup
          # cygserver.exe and cygpath.exe come from the cygwin package. There is no
          # separate cygserver package. --wait keeps setup from returning while
          # its restarted child is still installing.
          $packages = "bash,vim,cmake,gcc-g++,git,jq,libboost-devel,libssl-devel,make,perl,procps-ng,wget,zip,cygwin"
          $proc = Start-Process -FilePath $setup -Wait -PassThru -NoNewWindow -ArgumentList @(
            "--quiet-mode",
            "--wait",
            "--no-shortcuts",
            "--no-startmenu",
            "--no-desktop",
            "--site", "https://mirrors.kernel.org/sourceware/cygwin/",
            "--root", "C:\cygwin64",
            "--local-package-dir", (Join-Path $env:RUNNER_TEMP "cygwin-packages"),
            "--packages", $packages
          )
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }
          foreach ($path in @(
            "C:\cygwin64\bin\bash.exe",
            "C:\cygwin64\bin\cygpath.exe",
            "C:\cygwin64\bin\g++.exe",
            "C:\cygwin64\usr\sbin\cygserver.exe"
          )) {
            if (-not (Test-Path $path)) { throw "Missing ${path}" }
            Write-Output "found $path"
          }

      - name: Build the Windows package
        shell: bash
        working-directory: elbencho
        run: |
          set -euo pipefail
          git log -1 --oneline
          # Git Bash accepts C:/ paths. /c and /cygdrive are not both mounted.
          cyg_bin="C:/cygwin64/bin"
          test -x "$cyg_bin/cygpath.exe"
          test -x "$cyg_bin/bash.exe"
          repo_win=$(cygpath -w "$(pwd)")
          elb=$("$cyg_bin/cygpath.exe" -u "$repo_win")
          echo "Cygwin source path: ${elb}"
          # Git Bash rewrites a /cygdrive argument into a path under its own
          # install dir when it launches a Windows executable. Pass a D:/ path
          # and disable that conversion so the Cygwin path of the source tree
          # reaches Cygwin bash unchanged.
          script=$(cygpath -m "$(cd .. && pwd)/scripts/cygwin-build.sh")
          echo "Build script: ${script}"
          # -lc picks up the Cygwin profile. MSYS_NO_PATHCONV stops Git Bash
          # from rewriting the /cygdrive source path in this one command line.
          MSYS_NO_PATHCONV=1 "$cyg_bin/bash.exe" -lc "bash '$script' '$elb'"

      - name: Test the Windows executable
        shell: bash
        working-directory: elbencho
        run: |
          set -euo pipefail
          cyg_bin="C:/cygwin64/bin"
          test -x "$cyg_bin/cygpath.exe"
          test -x "$cyg_bin/bash.exe"
          repo_win=$(cygpath -w "$(pwd)")
          elb=$("$cyg_bin/cygpath.exe" -u "$repo_win")
          mkdir -p ../win-test-tmp
          tmp_win=$(cygpath -w "$(cd ../win-test-tmp && pwd)")
          tmp=$("$cyg_bin/cygpath.exe" -u "$tmp_win")
          script=$(cygpath -m "$(cd .. && pwd)/scripts/cygwin-test.sh")
          MSYS_NO_PATHCONV=1 "$cyg_bin/bash.exe" -lc "bash '$script' '$elb' '$tmp'"

      - name: Upload the zip to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ELBENCHO_RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: scripts/upload-draft-assets.sh elbencho/packaging/cygwin/elbencho-windows.zip
